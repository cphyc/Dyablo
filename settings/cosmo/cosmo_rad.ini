[amr]
bx                   = 4                   
by                   = 4                   
bz                   = 4                   
level_min            = 4        
level_max            = 4                
markers_kernel       = RefineCondition_mass
nboctspergroup       = 1024                  
use_block_data       = true
loadbalance_coherent_levels = 3
enable_load_balance_during_init = false
error_min=0.2
error_max=0.8

[hydro]
gamma0               = 1.666        
niter_riemann        = 10
iorder               = 2
slope_type           = 2       
riemann              = M1                
smallp               = 1e-18             
update               = HydroUpdate_RK2

[cosmology]
active               = true
da                   = 1.05
mass_coarsen_factor  = 0.9               
mass_refine_factor   = 8  
lookup_size          = 2048
omegab               = 0.049
clight_fraction      = 0.1

[dt]
dt_kernel            = Compute_dt_particle_velocity,Compute_dt_hydro,Compute_dt_cosmology,Compute_dt_rad
dt                   = 1.0e-4
particle_cfl         = 0.8
hydro_cfl            = 0.8

[gravity]
solver               = GravitySolver_cg
4_Pi_G               = 1000
CG_eps               = 1e-1

[particles]
update_position      = ParticleUpdate_CIC_move
update_density       = ParticleUpdate_CIC_density

[grafic]
inputDir=/data-local/IC/IC_6

[mesh]
boundary_type_xmax   = periodic          
boundary_type_xmin   = periodic          
boundary_type_ymax   = periodic            
boundary_type_ymin   = periodic            
boundary_type_zmax   = periodic            
boundary_type_zmin   = periodic            
ndim                 = 3                   
xmin                 = 0.0      
xmax                 = 1.0                 
ymin                 = 0.0                 
ymax                 = 1.0                 
zmin                 = 0.0     
zmax                 = 1.0

[source_terms]
updates              = SourceUpdate_Ionization_Chem

[rad]
update               = RadUpdate_euler_M1
temperature          = 1e4
xe_start             = 1.2e-3

[ionization]
rho_crit             = 8
ndot                 = 0.625e48
temp_black_body      = 50000
zre_start            = -1000.0
mode                 = regular
apply_cooling        = true
coupling             = true

[run]               
enable_output        = true                
initial_conditions   = grafic_fields,particle_grid
nstepmax             = 50000
output_frequency     = 1000             
nlog                 = 100  
t_end_var            = aexp
tend                 = 0.16         

[output]
backend              = IOManager_hdf5      
checkpoint           = IOManager_checkpoint
debug                = false
hdf5_enabled         = yes
output_real_type     = float               
outputdir            = /data-local/omarchal/test/                
outputprefix         = cosmo_rad
outputVtkAscii       = true
outputVtkBinary      = true
outputVtkAppended    = true
vtk_enabled          = yes
write_mesh_info      = yes
write_variables      = rho,e_rad,xe,temp
write_particle_variables = particles/vx,particles/vy,particles/vz,particles/mass