[amr]
bx                   = 16                  
by                   = 16                  
bz                   = 16                  
coarse_oct_resolution_x = 8                   
coarse_oct_resolution_y = 8                   
coarse_oct_resolution_z = 2                   
cycle_frequency      = 100                   
downflow_sign        = 1                   
error_max            = 0.80000000000000004  ; Unused
level_max            = 7
level_min            = 3                   
load_balancing_frequency = 2000
loadbalance_coherent_levels = 3                   
markers_kernel       = RefineCondition_downflows
nboctspergroup       = 64                  
remap                = MapUserData_mean    
velocity_coarsen     = -0.25               
velocity_refine      = 0.75                
[c91]
mpoly                = 1.0                  ; Unused
pert_amplitude       = 1.0e-5               ; Unused
rho0                 = 10.0                 ; Unused
seed                 = 12345                ; Unused
sigma                = 1.0                  ; Unused
t0                   = 10.0                 ; Unused
theta                = 20.0                 ; Unused
[cooling]
ff_fluxes            = 1.4                 
ff_layer             = one_cell            
update               = CoolingUpdate_FF    
[cosmology]
active               = false               
aend                 = 1                   
astart               = 0.01                
da                   = 1.02                
lookup_size          = 1024                
omega_m              = 0.29999999999999999 
omega_v              = 0.69999999999999996 
save_expansion_table = false               
[dt]
dt_kernel            = Compute_dt_hydro,Compute_dt_parabolic
hydro_cfl            = 0.8                 
parabolic_cfl        = 0.5                 
[gravity]
gravity_type         = 1                   
gx                   = 0.0                 
gy                   = 0.0                 
gz                   = 40.0                
solver               = none                
[hydro]
gamma0               = 1.666666667         
problem              = C91                 
riemann              = hllc                
smallc               = 1e-10               
smalle               = 1.0000000000000001e-05
smallp               = 1e-10               
smallr               = 1e-10               
three_waves          = false               
update               = HydroUpdate_euler   
well_balanced        = on                  
[ini]
print_config         = false               
[mesh]
boundary_type_xmax   = periodic            
boundary_type_xmin   = periodic            
boundary_type_ymax   = periodic            
boundary_type_ymin   = periodic            
boundary_type_zmax   = reflecting          
boundary_type_zmin   = reflecting          
ndim                 = 3                   
xmax                 = 4.0                 
xmin                 = 0.0                 
ymax                 = 4.0                 
ymin                 = 0.0                 
zmax                 = 1.0                 
zmin                 = 0.0                 
[output]
backend              = IOManager_hdf5      
checkpoint           = IOManager_checkpoint
output_real_type     = float               
outputdir            = ./                  
outputprefix         = C91                 
write_particle_variables =                     
write_variables      = rho,rho_vx,rho_vy,rho_vz,e_tot,rank,level
[particles]
update_density       = none                
update_position      = none                
[restart]
filename             = .//restart_C91_69922.h5 ; Default
[run]
checkpoint_frequency = -1                  
checkpoint_timeslice = 2.0               
enable_checkpoint    = yes                 
enable_output        = true                
initial_conditions   = restart              ; Default
iter_start           = 0                  ; Default
nlog                 = 10                  
nstepmax             = 1000000                 
output_frequency     = -1                  
output_slice_var     = time                
output_timeslice     = 1.0               
t_end_var            = time                
tend                 = 2.0               
tstart               = 00.0
use_tend             = true                
[thermal_conduction]
diffusivity_mode     = constant            
kappa                = 0.07                
update               = ParabolicUpdate_explicit
[viscosity]
mu                   = 0.0028              
update               = ParabolicUpdate_explicit
