name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_mpi1_verify:
        description: Run verification cases with one MPI process
        type: boolean
        default: false
      run_custom_test:
        description: Run a custom input file and render its output
        type: boolean
        default: false
      ini_file:
        description: Input file in build/dyablo/bin
        type: string
        default: test_gravity_spheres_3D.ini
      pvsm_file:
        description: ParaView state file in build/dyablo/bin
        type: string
        default: visu_gravity_spheres_3D.pvsm
      mpi_count:
        description: MPI process count for the custom test
        type: number
        default: 4

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        backend: [openmp, cuda]
    uses: ./.github/workflows/ci-backend.yml
    with:
      backend: ${{ matrix.backend }}
      run_mpi1_verify: ${{ inputs.run_mpi1_verify || false }}
      run_custom_test: ${{ inputs.run_custom_test || false }}
      ini_file: ${{ inputs.ini_file || 'test_gravity_spheres_3D.ini' }}
      pvsm_file: ${{ inputs.pvsm_file || 'visu_gravity_spheres_3D.pvsm' }}
      mpi_count: ${{ inputs.mpi_count || 4 }}
