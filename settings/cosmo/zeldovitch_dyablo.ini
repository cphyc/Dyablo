[amr]
bx                   = 4                   
by                   = 4                   
bz                   = 4                   
level_min            = 5     
level_max            = 7           
markers_kernel       = RefineCondition_mass
nboctspergroup       = 32                  
use_block_data       = true
loadbalance_coherent_levels = 3
enable_load_balance_during_init = false

[hydro]
gamma0               = 1.666        
niter_riemann        = 10
iorder               = 2
slope_type           = 2       
riemann              = hllc                
smallp               = 1e-18             
update               = HydroUpdate_euler

[cosmology]
active               = true
aStart               = 6.622517e-03
aEnd                 = 0.15
da                   = 1.05
mass_coarsen_factor  = 0.9               
mass_refine_factor   = 64  
lookup_size          = 262144
omegam=0.3
omegav=0.7
omegab=0.049
save_expansion_table = true

[zeldovitch_pancake]
aCross = 0.15

[dt]
dt_kernel            = Compute_dt_particle_velocity,Compute_dt_hydro,Compute_dt_cosmology
dt                   = 1.0e-4
particle_cfl         = 0.8
hydro_cfl            = 0.8

[gravity]
solver               = GravitySolver_cg
4_Pi_G               = 1000
CG_eps               = 1e-3
print_cg_iter        = off

[particles]
update_position      = ParticleUpdate_CIC_move
update_density       = ParticleUpdate_CIC_density


[mesh]
boundary_type_xmax   = periodic          
boundary_type_xmin   = periodic          
boundary_type_ymax   = periodic            
boundary_type_ymin   = periodic            
boundary_type_zmax   = periodic            
boundary_type_zmin   = periodic            
ndim                 = 3                   
xmin                 = 0.0      
xmax                 = 1.0                 
ymin                 = 0.0                 
ymax                 = 1.0                 
zmin                 = 0.0     
zmax                 = 1.0

[run]               
enable_output        = true                
initial_conditions   = zeldovitch_pancake,particle_grid
nstepmax             = 200000
output_frequency     = 20000              
nlog                 = 25  

[output]
backend              = IOManager_hdf5      
checkpoint           = IOManager_checkpoint
debug                = false
hdf5_enabled         = yes
output_real_type     = float               
outputdir            = ./out/            
outputprefix         = zeldo
outputVtkAscii       = true
outputVtkBinary      = true
outputVtkAppended    = true
vtk_enabled          = yes
write_mesh_info      = yes
write_variables      = rho,rho_vx,rho_vy,rho_vz,e_tot
write_particle_variables = particles/vx,particles/vy,particles/vz,particles/mass