[run]
nStepmax=1000000
output_expslice=0.1
initial_conditions=zeldovitch_pancake,particle_grid
t_end_var            = aexp
tend                 = 0.16
use_tend             = true
nlog                 = 100 

[dt]
dt_kernel=Compute_dt_particle_velocity,Compute_dt_cosmology,Compute_dt_hydro
particle_cfl         = 0.8
hydro_cfl            = 0.8

[cosmology]
aStart=0.01961 
aEnd=0.5
da = 1.0005  
active=true
omegam=0.3
omegav=0.7
omegab=0.049
lookup_size=2048
save_expansion_table=true

[zeldovitch_pancake]
across = 0.166667    

[particle_grid]
total_mass=1

[amr]
level_min=4
level_max=4
nbOctsPerGroup=32

coarse_oct_resolution_y=1
coarse_oct_resolution_z=1

# init step may contain calls to globalRefine
# if the following option is true, we interleave
# calls to load balancing in between globalRefine
# if the following option is false, a single load
# balancing operation is done at the end of
# globalRefine steps
enable_load_balance_during_init=false

epsilon_refine=0.01
epsilon_coarsen=0.03

use_block_data=yes
bx=4
by=4
bz=4

# control MPI load balancing (number of time steps between two
# consecutive load balacing)
load_balancing_frequency=500000

# control AMR cycle frequence (number of time steps between two
# consecutive AMR cycles)
cycle_frequency=100000

[mesh]
ndim=3

xmin=0.0
xmax=1.0

ymin=0.0
ymax=1.0

zmin=0.0
zmax=1.0

boundary_type_xmin=periodic
boundary_type_xmax=periodic

boundary_type_ymin=periodic
boundary_type_ymax=periodic

boundary_type_zmin=periodic
boundary_type_zmax=periodic

[hydro]
gamma0=1.666
niter_riemann=10
iorder=2
slope_type=2
#update=none
update=HydroUpdate_RK2
smallp= 1e-18  

[gravity]
#gravity_type=field
solver=GravitySolver_cg
CG_eps=1.0e-3

[particles]
#update_position=ParticleUpdate_tracers_move
update_position=ParticleUpdate_CIC_move
update_density=ParticleUpdate_CIC_density

[output]
outputDir=./
outputPrefix=zeldovitch
outputVtkAscii=false
write_variables=rho,rho_vx,rho_vy,rho_vz,e_tot
write_particle_variables=particles/vx,particles/vy,particles/vz
write_mesh_info=yes
hdf5_enabled=yes
vtk_enabled=no

[other]
implementationVersion=0


