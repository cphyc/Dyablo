[amr]
bx                   = 4                   
by                   = 4                   
bz                   = 4                   
coarse_oct_resolution_x = 2                    ; Default
coarse_oct_resolution_y = 2                    ; Default
coarse_oct_resolution_z = 2                    ; Default
cycle_frequency      = 1                    ; Default
enable_load_balance_during_init = false                ; Unused
error_max            = 0.80000000000000004  ; Default
error_min            = 0.20000000000000001  ; Default
level_max            = 1                   
level_min            = 1                   
load_balancing_frequency = 1000                 ; Default
loadbalance_coherent_levels = 3                   
markers_kernel       = RefineCondition_second_derivative_error ; Default
nboctspergroup       = 1024                
remap                = MapUserData_mean     ; Default
use_block_data       = true                 ; Unused
[cooling]
update               = CoolingUpdate_Theuns_1998
[cosmology]
active               = false                ; Default
aend                 = 1                    ; Default
astart               = 0.01                 ; Default
da                   = 1.02                 ; Default
lookup_size          = 1024                 ; Default
omega_m              = 0.29999999999999999  ; Default
omega_v              = 0.69999999999999996  ; Default
save_expansion_table = false                ; Default
[dt]
dt                   = 1.0e-4               ; Unused
dt_kernel            = Compute_dt_hydro    
hydro_cfl            = 0.8                 
[gravity]
4_pi_g               = 1                    ; Default
gravity_type         = none                 ; Default
solver               = none                 ; Default
[hydro]
gamma0               = 1.6666667           
iorder               = 2                    ; Unused
niter_riemann        = 10                   ; Unused
riemann              = hllc                
slope_type           = 2                    ; Unused
smallc               = 1e-10                ; Default
smalle               = 1.0000000000000001e-05 ; Default
smallp               = 1e-18               
smallr               = 1e-10                ; Default
three_waves          = false                ; Default
update               = HydroUpdate_dummy   
well_balanced        = false                ; Default
[ini]
print_config         = false                ; Default
[ionization]
update               = none                 ; Default
[mesh]
boundary_type_xmax   = periodic            
boundary_type_xmin   = periodic            
boundary_type_ymax   = periodic            
boundary_type_ymin   = periodic            
boundary_type_zmax   = periodic            
boundary_type_zmin   = periodic            
ndim                 = 3                   
xmax                 = 1.0                 
xmin                 = 0.0                 
ymax                 = 1.0                 
ymin                 = 0.0                 
zmax                 = 1.0                 
zmin                 = 0.0                 
[output]
backend              = IOManager_hdf5      
checkpoint           = IOManager_checkpoint
debug                = false                ; Unused
hdf5_enabled         = yes                  ; Unused
output_real_type     = float               
outputdir            = ./                  
outputprefix         = test_cosmo          
outputvtkappended    = true                 ; Unused
outputvtkascii       = true                 ; Unused
outputvtkbinary      = true                 ; Unused
vtk_enabled          = yes                  ; Unused
write_mesh_info      = yes                  ; Unused
write_particle_variables =                      ; Default
write_variables      = rho,rho_vx,rho_vy,rho_vz,e_tot
[particles]
update_density       =                      ; Default
update_position      =                      ; Default
[rad]
update               = none                 ; Default
[run]
checkpoint_frequency = 10                  
checkpoint_timeslice = -1                   ; Default
cosmo_proxy          = false                ; Default
enable_checkpoint    = true                 ; Default
enable_output        = true                
initial_conditions   = T_rho_grid          
iter_start           = 0                    ; Default
nlog                 = 10                  
nstepmax             = 4                   
output_frequency     = 2000                
output_slice_var     = time                 ; Default
output_timeslice     = -1                   ; Default
t_end_var            = time                
tend                 = 0.9999              
tstart               = 0                    ; Default
use_tend             = true                 ; Default
[t_rho_grid]
rhomax               = 1e4                 
rhomin               = 1e-4                
tmax                 = 1e8                 
tmin                 = 1e2                 
zmax                 = 20                  
zmin                 = 0                   
[thermal_conduction]
update               = none                 ; Default
[units]
aexp                 = 0.2                  ; Unused
density              = 1.67262311e-21      
length               = 3.08567758e+19      
time                 = 3.15576e+13         
[viscosity]
update               = none                 ; Default
