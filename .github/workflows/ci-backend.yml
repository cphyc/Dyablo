name: CI backend

on:
  workflow_call:
    inputs:
      backend:
        description: Build and test backend
        type: string
        required: true
      run_mpi1_verify:
        description: Run verification cases with one MPI process
        type: boolean
        default: false
      run_custom_test:
        description: Run a custom input file and render its output
        type: boolean
        default: false
      ini_file:
        description: Input file in build/dyablo/bin
        type: string
        default: test_gravity_spheres_3D.ini
      pvsm_file:
        description: ParaView state file in build/dyablo/bin
        type: string
        default: visu_gravity_spheres_3D.pvsm
      mpi_count:
        description: MPI process count for the custom test
        type: number
        default: 4

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.backend }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SCCACHE_GHA_ENABLED: "true"
      C_COMPILER_LAUNCHER: ${{ inputs.backend == 'cuda' && 'sccache' || 'ccache' }}
      CXX_COMPILER_LAUNCHER: ${{ inputs.backend == 'cuda' && 'ccache' || 'sccache' }}
      DYABLO_CMAKE_ARGS: "-DCMAKE_C_COMPILER_LAUNCHER=${{ inputs.backend == 'cuda' && 'sccache' || 'ccache' }};-DCMAKE_CXX_COMPILER_LAUNCHER=${{ inputs.backend == 'cuda' && 'ccache' || 'sccache' }}"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      # Checkout timestamps change between runners, even for the same wrapper.
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CUDA toolkit
        if: ${{ inputs.backend == 'cuda' }}
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.3.1"
          method: network
          linux-local-args: '["--toolkit"]'
          sub-packages: '["nvcc"]'
          log-file-suffix: cuda-toolkit.log

      - name: Verify CUDA compiler
        if: ${{ inputs.backend == 'cuda' }}
        run: |
          nvcc --version
          cuda_root="$(dirname "$(dirname "$(readlink -f "$(command -v nvcc)")")")"
          test -d "$cuda_root/include"
          echo "CUDA_INCLUDE_DIR=$cuda_root/include" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libhwloc-dev libxml2-dev libopenmpi-dev libhdf5-openmpi-dev \
            libboost-test-dev libfftw3-dev \
            python3-setuptools python3-pybind11 python3-h5py python3-unyt

      - name: Install ccache
        run: sudo apt-get install --yes ccache

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Identify ccache toolchain
        id: ccache-toolchain
        env:
          BACKEND: ${{ inputs.backend }}
        run: |
          {
            /usr/bin/gcc --version
            /usr/bin/g++ --version
            ccache --version
            if [[ "$BACKEND" == cuda ]]; then
              nvcc --version
              sha256sum external/kokkos/bin/nvcc_wrapper
            fi
          } > "$RUNNER_TEMP/ccache-toolchain.txt"
          echo "hash=$(sha256sum "$RUNNER_TEMP/ccache-toolchain.txt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          # A new key lets each run save its additions after restoring a prior
          # cache. Never restore CUDA entries across toolchain changes.
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.backend }}-${{ steps.ccache-toolchain.outputs.hash }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.backend }}-${{ steps.ccache-toolchain.outputs.hash }}-

      - name: Reset compiler cache statistics
        run: |
          "${SCCACHE_PATH}" --zero-stats
          ccache --zero-stats

      - name: Build OpenMP
        if: ${{ inputs.backend == 'openmp' }}
        run: .gitlab-ci/build-openmp.sh

      - name: Build CUDA for H100
        if: ${{ inputs.backend == 'cuda' }}
        env:
          CXX: ${{ github.workspace }}/external/kokkos/bin/nvcc_wrapper
          KOKKOS_ARCH: HOPPER90
          NVCC_WRAPPER_DEFAULT_COMPILER: /usr/bin/g++
          CCACHE_COMPILERTYPE: nvcc
        run: |
          # Match the system CUDA includes supplied by Kokkos when using a
          # regular host C++ compiler locally. With CXX=nvcc_wrapper these
          # otherwise implicit includes produce different NVCC diagnostics.
          export DYABLO_CMAKE_ARGS="${DYABLO_CMAKE_ARGS};-DCMAKE_CXX_STANDARD_INCLUDE_DIRECTORIES=${CUDA_INCLUDE_DIR}"
          .gitlab-ci/build-cuda.sh

      - name: Verify compiler settings
        env:
          BACKEND: ${{ inputs.backend }}
        run: |
          grep -E '^CMAKE_(C|CXX)_COMPILER_LAUNCHER:' build/dyablo/CMakeCache.txt
          grep -Eq "^CMAKE_C_COMPILER_LAUNCHER:[^=]+=${C_COMPILER_LAUNCHER}$" build/dyablo/CMakeCache.txt
          grep -Eq "^CMAKE_CXX_COMPILER_LAUNCHER:[^=]+=${CXX_COMPILER_LAUNCHER}$" build/dyablo/CMakeCache.txt
          if [[ "$BACKEND" == cuda ]]; then
            grep -Fq -- "-isystem ${CUDA_INCLUDE_DIR}" build/dyablo/compile_commands.json
          fi

      - name: Show compiler cache statistics
        if: always()
        run: |
          "${SCCACHE_PATH}" --show-stats
          ccache --show-stats --verbose

      - name: Package build tree
        run: tar --exclude='*/CMakeFiles' --exclude='*/CMakeFiles/*' -cf "${{ inputs.backend }}-build.tar" build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.backend }}-build
          path: ${{ inputs.backend }}-build.tar
          retention-days: 1

  test:
    name: Test ${{ inputs.backend }}
    if: ${{ inputs.backend != 'cuda' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OMPI_MCA_btl: "^vader"
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up simulated H100
        if: ${{ inputs.backend == 'cuda' }}
        uses: pantheongpu/setup-pantheonsim@v0.1.10
        with:
          gpu: nvidia/h100
          count: 1
          cuda-toolkit: "13.3"

      - name: Check simulated GPU
        if: ${{ inputs.backend == 'cuda' }}
        run: |
          nvidia-smi
          gpu_names="$(nvidia-smi --query-gpu=name --format=csv,noheader)"
          test "$(printf '%s\n' "$gpu_names" | wc -l)" -eq 1
          grep -q H100 <<< "$gpu_names"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.backend }}-build

      - name: Restore build tree
        run: tar -xf "${{ inputs.backend }}-build.tar"

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libhwloc-dev libxml2-dev libopenmpi-dev libhdf5-openmpi-dev \
            libboost-test-dev libfftw3-dev \
            python3-setuptools python3-pybind11 python3-h5py python3-unyt \
            python3-paraview xvfb

      - name: Install and build pyablo
        run: |
          git clone https://github.com/cphyc/pyablo.git
          cd pyablo
          git submodule init
          git submodule update
          mkdir build
          cd build
          cmake .. -DMAKE_BUILD_TYPE=Release
          make -j
          export PYTHONPATH=${PYTHONPATH}:$(pwd)

      - name: Run unit tests
        run: .gitlab-ci/run_unit_tests.sh

      - name: Run and render examples
        run: .gitlab-ci/run_and_render_all.sh

      - name: Verify examples (3 MPI processes)
        run: .gitlab-ci/run_and_verify_all.sh 3

      - name: Verify examples (1 MPI process)
        if: ${{ inputs.run_mpi1_verify }}
        run: .gitlab-ci/run_and_verify_all.sh 1

      - name: Run custom example
        if: ${{ inputs.run_custom_test }}
        env:
          TEST_INI: ${{ inputs.ini_file }}
          TEST_PVSM: ${{ inputs.pvsm_file }}
          MPI_COUNT: ${{ inputs.mpi_count }}
        run: |
          .gitlab-ci/run_testcase_mpi.sh "$TEST_INI" "$MPI_COUNT"
          .gitlab-ci/render.sh "$TEST_PVSM"

      - name: Upload test reports and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.backend }}-test-results
          path: |
            build/dyablo/unit_test/gtest_reports/*.xml
            run_*.txt
            **/run.txt
            **/verification.txt
            *.png
            */*.png
            report.xml
          if-no-files-found: ignore
          retention-days: 7
